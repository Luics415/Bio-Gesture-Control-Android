name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de versión que se publicará (por ejemplo, v3.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore private signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.BIOGESTURE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BIOGESTURE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BIOGESTURE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BIOGESTURE_KEY_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEY_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Faltan los secrets de firma requeridos." >&2
            exit 1
          fi
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/biogesture-release.jks"

      - name: Test and build signed release
        env:
          ORG_GRADLE_PROJECT_BIOGESTURE_STORE_FILE: ${{ runner.temp }}/biogesture-release.jks
          ORG_GRADLE_PROJECT_BIOGESTURE_STORE_PASSWORD: ${{ secrets.BIOGESTURE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BIOGESTURE_KEY_ALIAS: ${{ secrets.BIOGESTURE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BIOGESTURE_KEY_PASSWORD: ${{ secrets.BIOGESTURE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk BioGesture-Control-${RELEASE_TAG}.apk
          sha256sum BioGesture-Control-${RELEASE_TAG}.apk > BioGesture-Control-${RELEASE_TAG}.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          "BioGesture-Control-${RELEASE_TAG}.apk"
          "BioGesture-Control-${RELEASE_TAG}.sha256"
          --title "BioGesture Control Android ${RELEASE_TAG}"
          --generate-notes
